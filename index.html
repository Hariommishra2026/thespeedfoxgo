<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpeedFoxGo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
overflow:hidden;
background:#0d3310;
color:white;
}

#loading{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(#0d3310,#176322);
z-index:1000;
}

.barBox{
width:400px;
height:25px;
background:#222;
border-radius:30px;
overflow:hidden;
margin-top:20px;
}

.bar{
height:100%;
width:0%;
background:linear-gradient(
90deg,
#7fff00,
#00ff99
);
}

#menu{
display:none;
position:fixed;
inset:0;
justify-content:center;
align-items:center;
flex-direction:column;
background:linear-gradient(#0d3310,#176322);
}

.btn{
width:260px;
padding:15px;
margin:10px;
border:none;
border-radius:15px;
font-size:20px;
cursor:pointer;
background:#32cd32;
color:white;
font-weight:bold;
box-shadow:0 0 20px lime;
}

.btn:hover{
transform:scale(1.05);
}

#game{
display:none;
width:100vw;
height:100vh;
position:relative;
overflow:hidden;
background:linear-gradient(
#6fd06f,
#287428
);
}

.hud{
position:absolute;
top:10px;
left:10px;
right:10px;
display:flex;
justify-content:space-between;
font-weight:bold;
font-size:20px;
z-index:50;
}

.road{
position:absolute;
bottom:0;
width:100%;
height:220px;
background:#866037;
}

.fox{
position:absolute;
left:350px;
bottom:120px;
font-size:65px;
z-index:10;
}

.coin{
position:absolute;
font-size:35px;
}

.fruit{
position:absolute;
font-size:35px;
}

.tree{
position:absolute;
font-size:80px;
}

.watermark{
position:fixed;
right:10px;
bottom:10px;
font-weight:bold;
color:#adff2f;
}

.leaf{
position:absolute;
font-size:20px;
animation:fall linear infinite;
}

@keyframes fall{

from{
transform:translateY(-50px);
}

to{
transform:translateY(110vh);
}

}

#mobileControls{

position:fixed;

left:50%;

transform:translateX(-50%);

bottom:20px;

display:flex;

gap:15px;

z-index:999;
}

#mobileControls button{

width:70px;
height:70px;

border:none;

border-radius:50%;

font-size:28px;

background:#32cd32;

color:white;

box-shadow:0 0 20px lime;

}

@media(min-width:900px){

#mobileControls{
display:none;
}

}
</style>
</head>

<body>

<div id="loading">

<h1>🦊 SPEEDFOXGO</h1>

<div class="barBox">
<div class="bar" id="bar"></div>
</div>

<h2 id="percent">0%</h2>

<p style="margin-top:20px">
Loading Jungle Assets...
</p>

</div>

<div id="menu">

<h1 style="font-size:60px">
🦊 SPEEDFOXGO
</h1>

<h3>Select Difficulty</h3>

<button class="btn" onclick="startGame('easy')">
🟢 EASY
</button>

<button class="btn" onclick="startGame('medium')">
🟡 MEDIUM
</button>

<button class="btn" onclick="startGame('hard')">
🔴 HARDCORE
</button>

</div>

<div id="game">

<div class="hud">

<div id="health">
🌴 Hits: 0/3
</div>

<div id="coins">
🪙 0
</div>

<div id="boost">
⚡ 0
</div>

<div id="distance">
🏃 0m
</div>

</div>

<div class="fox" id="fox">
🦊
</div>

<div class="road"></div>

</div>

<div class="watermark">
Created by Tech.Hariom7
</div>

<div id="mobileControls">

<button id="leftBtn">⬅️</button>

<button id="jumpBtn">⬆️</button>

<button id="rightBtn">➡️</button>

</div>

<div id="gameOverScreen">

<div class="gameCard">

<div class="cryFox">

🦊

<div class="tear">
💧
</div>

</div>

<h1>GAME OVER</h1>

<p>SpeedFox hit too many trees!</p>

<div id="statsBox"></div>

<button class="goBtn"
onclick="retryGame()">
🔄 Retry
</button>

<button class="goBtn"
onclick="quitGame()">
🚪 Quit
</button>

</div>

</div>

<script>

for(let i=0;i<30;i++){

let leaf=document.createElement("div");

leaf.className="leaf";

leaf.innerHTML="🍃";

leaf.style.left=
Math.random()*100+"vw";

leaf.style.animationDuration=
(4+Math.random()*5)+"s";

document.body.appendChild(leaf);

}

let prog=0;

let load=setInterval(()=>{

prog++;

bar.style.width=
prog+"%";

percent.innerHTML=
prog+"%";

if(prog>=100){

clearInterval(load);

loading.style.display="none";

menu.style.display="flex";

}

},20);

let fox =
document.getElementById("fox");

let lane = 1;

let coins = 0;

let boost = 0;

let hits = 0;

let distance = 0;

let speed = 8;

let jumping=false;

let coinLoop;
let fruitLoop;
let treeLoop;
let distanceLoop;

const lanes=[
150,
350,
550
];

function jumpFox(){

if(jumping) return;

jumping=true;

fox.style.transition=".25s";

fox.style.bottom="250px";

setTimeout(()=>{
fox.style.bottom="120px";
},250);

setTimeout(()=>{
jumping=false;
},500);

}

document.addEventListener("keydown",e=>{

if(e.key==="ArrowLeft" && lane>0){

lane--;

fox.style.left=
lanes[lane]+"px";

}

if(e.key==="ArrowRight" && lane<2){

lane++;

fox.style.left=
lanes[lane]+"px";

}

if(e.key==="ArrowUp"){

jumpFox();

}

});

function startGame(mode){

menu.style.display="none";

game.style.display="block";

if(mode==="easy") speed=6;

if(mode==="medium") speed=8;

if(mode==="hard") speed=12;

coinLoop=
setInterval(spawnCoin,1200);

fruitLoop=
setInterval(spawnFruit,2200);

treeLoop=
setInterval(spawnTree,1800);

distanceLoop=
setInterval(()=>{

distance++;

document.getElementById(
"distance"
).innerHTML=
"🏃 "+distance+"m";

},100);
}

function spawnCoin(){

let c=document.createElement("div");

c.className="coin";

c.innerHTML="🪙";

c.style.left=
lanes[Math.floor(Math.random()*3)]
+"px";

c.style.top="-50px";

game.appendChild(c);

moveObject(c,false);

}

function spawnFruit(){

const fruits=[
"🍎",
"🍌",
"🍓",
"🍇"
];

let f=document.createElement("div");

f.className="fruit";

f.innerHTML=
fruits[Math.floor(Math.random()*4)];

f.style.left=
lanes[Math.floor(Math.random()*3)]
+"px";

f.style.top="-50px";

game.appendChild(f);

moveObject(f,true);

}

function spawnTree(){

let t=document.createElement("div");

t.className="tree";

t.innerHTML="🌴";

t.style.left=
lanes[Math.floor(Math.random()*3)]
+"px";

t.style.top="-90px";

game.appendChild(t);

let mover=setInterval(()=>{

t.style.top=
(t.offsetTop+speed)+"px";

if(collide(fox,t)){

hits++;

health.innerHTML=
"🌴 Hits: "+hits+"/3";

t.remove();

clearInterval(mover);

if(hits>=3){

showGameOver();

}

}
if(t.offsetTop > window.innerHeight){

t.remove();

clearInterval(mover);

}

},20);

}

function moveObject(obj,isFruit){

let mover=setInterval(()=>{

obj.style.top=
(obj.offsetTop+speed)+"px";

if(collide(fox,obj)){

if(isFruit){

boost+=20;

document.getElementById(
"boost"
).innerHTML=
"⚡ "+boost;

}else{

coins+=10;

document.getElementById(
"coins"
).innerHTML=
"🪙 "+coins;

}

obj.remove();

clearInterval(mover);

}

if(obj.offsetTop >
window.innerHeight){

obj.remove();

clearInterval(mover);

}

},20);

}

function collide(a,b){

let r1=a.getBoundingClientRect();

let r2=b.getBoundingClientRect();

return !(

r1.right < r2.left ||

r1.left > r2.right ||

r1.bottom < r2.top ||

r1.top > r2.bottom

);

}

leftBtn.onclick=()=>{

if(lane>0){

lane--;

fox.style.left=
lanes[lane]+"px";

}

};

rightBtn.onclick=()=>{

if(lane<2){

lane++;

fox.style.left=
lanes[lane]+"px";

}

};

jumpBtn.onclick=()=>{

jumpFox();

};

function showGameOver(){

statsBox.innerHTML=

`
<h2>🪙 Coins: ${coins}</h2>
<h2>⚡ Boost: ${boost}</h2>
<h2>🏃 Distance: ${distance}m</h2>
`;

gameOverScreen.style.display=
"flex";

}

function retryGame(){

location.reload();

}

function quitGame(){

gameOverScreen.style.display=
"none";

game.style.display=
"none";

menu.style.display=
"flex";

}

</script>

<style>

#gameOverScreen{

display:none;

position:fixed;

inset:0;

justify-content:center;

align-items:center;

background:rgba(0,0,0,.9);

z-index:9999;

}

.gameCard{

background:
linear-gradient(
180deg,
#0d3310,
#176322
);

padding:40px;

border-radius:25px;

text-align:center;

box-shadow:
0 0 30px lime;

}

.cryFox{

font-size:120px;

position:relative;

animation:
foxBounce 1.2s infinite;

}

.tear{

position:absolute;

top:20px;
right:20px;

font-size:30px;

animation:
tearDrop 1s infinite;

}

.goBtn{

padding:12px 20px;

margin:10px;

border:none;

border-radius:15px;

background:#32cd32;

color:white;

font-size:18px;

cursor:pointer;

}

@keyframes foxBounce{

0%{
transform:translateY(0);
}

50%{
transform:translateY(-10px);
}

100%{
transform:translateY(0);
}

}

@keyframes tearDrop{

0%{
opacity:1;
transform:translateY(0);
}

100%{
opacity:0;
transform:translateY(40px);
}

}

</style>

</body>
</html>
